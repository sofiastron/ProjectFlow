# ===================================
# MySQL Configuration
# ===================================
spring.datasource.url=jdbc:mysql://localhost:3306/projectflow?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=Fatima.2003
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.auto=update
# JPA/Hibernate Configuration
# ===================================

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


spring.jpa.properties.javax.persistence.schema-generation.database.action=create

# ===================================
# Server Configuration
# ===================================
server.port=8000
server.error.include-stacktrace=never

# ===================================
# Fix JSON and Validation Issues
# ===================================
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.main.allow-circular-references=true
spring.main.banner-mode=console

# ===================================
# Logging Configuration
# ===================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.example.projectflow=DEBUG